# ADR-0007: weekly, grouped, with the same 3-day cooldown as bunfig.toml.
version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
    groups:
      dependencies:
        patterns: ["*"]
    ignore:
      # @types/node follows the Node major pinned in engines.node and .node-version;
      # it moves by hand when the project moves to the next Active LTS.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    labels: [dependencies, no-spec]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns: ["*"]
    labels: [dependencies, no-spec]
